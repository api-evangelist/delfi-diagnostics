name: Delfi Diagnostics
description: DELFI Diagnostics is a precision oncology company, founded in 2019 and built on research
  from the Johns Hopkins Kimmel Cancer Center, that combines machine learning with genome-wide analysis
  of cell-free DNA fragmentation patterns (an approach it calls DNA fragmentomics, or "fragmentomes")
  to develop accessible, blood-based cancer screening and treatment-monitoring tests. Its first
  commercial product, FirstLook Lung, is a laboratory-developed liquid biopsy screening test for
  lung cancer that runs from a simple blood draw and reports a high negative predictive value; the
  company also offers DELFI-TF for treatment monitoring and partners with health systems and
  pharmaceutical researchers. DELFI operates a CLIA laboratory and is headquartered in Palo Alto,
  California. This profile tracks the company in the API Evangelist network; DELFI publishes no public
  developer API surface.
